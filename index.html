<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Entonador Ferretero - Control de Asistencia</title>
    <style>
      :root {
        --bg-color: #0F172A; /* Azul muy oscuro */
        --text-color: #F8FAFC;
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
      }

      /* Si tienes la imagen, descomenta y usa esto: */
      /*
      body {
        margin: 0;
        min-height: 100vh;
        background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('data:image/png;base64,TU_BASE64_AQUI');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: var(--text-color);
        font-family: 'Inter', system-ui, sans-serif;
      }
      */

      /* Fondo alternativo sin imagen (por ahora) */
      body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: 'Inter', system-ui, sans-serif;
      }

      /* Clase para el efecto cristal */
      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: 1rem;
      }

      /* Animación Skeleton Loader */
      @keyframes shimmer {
        0% { background-position: -1000px 0; }
        100% { background-position: 1000px 0; }
      }
      .skeleton {
        background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
        background-size: 1000px 100%;
        animation: shimmer 2s infinite linear;
        border-radius: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
