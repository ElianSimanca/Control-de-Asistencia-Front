<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Entonador Ferretero | Asistencia</title>
    
    <!-- ESTA ES LA LÍNEA MÁGICA PARA EL FAVICON -->
    <link rel="icon" type="image/png" href="/logo.png?v=1" />
    
    <!-- Fuente corporativa Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --bg-color: #0B1120;
        --text-color: #F8FAFC;
        --glass-bg: rgba(30, 41, 59, 0.6);
        --glass-border: rgba(255, 255, 255, 0.08);
      }

      body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: 'Outfit', system-ui, sans-serif;
        background-image: 
          radial-gradient(circle at top right, rgba(26, 54, 93, 0.6), transparent 40%),
          radial-gradient(circle at bottom left, rgba(21, 128, 61, 0.3), transparent 40%);
        background-attachment: fixed;
      }

      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-top: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 1rem;
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
      }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
